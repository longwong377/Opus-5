; HOW THIS PROJECT BECOMES SOMETHING A STRANGER CAN RUN.
;
; `docs/MASTER-PLAN.md` A2 opens with "a stranger downloads ONE FILE, runs it at
; 60 fps, arrives at Babylon 5 as a person with papers". Until session 4t this
; file did not exist, there was no menu and `tools/` had no packaging path, so
; the honest state of that sentence was: **there was no way for a person to
; start this at all.** Every other item in every batch improves something a
; player cannot reach.
;
; TWO FACTS ABOUT THIS PROJECT MAKE THE PRESET UNUSUAL, AND BOTH ARE MEASURED
; RATHER THAN ASSUMED -- read them before "fixing" anything below.
;
;   1. THE WORLD IS NOT INSIDE res://. `scripts/main.gd::_root()` is
;      `globalize_path("res://") + ".."`, and every deck mesh, collision shell,
;      interactables sidecar, arrival sequence, cell set, audio bank and vista
;      manifest is read from `<root>/station/generated/...`. That tree is 669 MB
;      on this box and it is OUTSIDE the Godot project directory, so **no export
;      preset can pack it**: Godot's exporter walks `res://` and nothing above
;      it. An export of this project is therefore the ENGINE plus the SCRIPTS,
;      and `tools/package.sh` stages the data tree beside it so that `res://..`
;      resolves in the exported layout exactly as it does in the source tree.
;      A preset that claimed otherwise would ship a binary that boots to
;      `main: no boot manifest` and quits 2.
;
;   2. THE BINARY MUST BE THE DOUBLE-PRECISION ONE. The station is 8,047 m long
;      and the flight envelope is 50 km; `docs/adr/0001-engine-choice.md` and
;      `station/physics/floating_origin.py` are why `project.godot` declares
;      `config/features=... "Double Precision"`. Godot's stock export templates
;      are single precision, so `custom_template/release` below points at a
;      double-precision template and `tools/package.sh` fails loudly -- and
;      names the missing file -- rather than silently exporting a single build.
;      That is CLAUDE.md's render-fallback rule applied to packaging: a tool
;      that can substitute a lesser mode for the one asked for must say which
;      one it used, in its output, on every run.
;
; `embed_pck=false` on purpose. The distributable "one file" is the tarball
; `tools/package.sh` writes, not the executable -- because of fact 1 the
; executable alone is never runnable, and an embedded pck would make that
; failure harder to see rather than easier.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The engine's own import cache and the editor's project-manager leftovers.
; Everything else under res:// is scripts, scenes and .tres materials, all of
; which the game loads by path at runtime.
exclude_filter="*.import.bak, .godot/imported/*"
export_path="../dist/Babylon5/game/Babylon5.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
; SET BY tools/package.sh, NOT HERE. The path to a double-precision export
; template is a property of the machine, and a hard-coded absolute path in a
; committed file is a path that is wrong on every other machine. package.sh
; writes the resolved path into a throwaway copy of this file and exports from
; that; if it cannot find one it says so with the error and produces the pack
; instead of a binary, rather than producing a binary that is quietly single
; precision.
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
export DISPLAY=:0
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
kill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")
rm -rf \"{temp_dir}\""
