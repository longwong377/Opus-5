# ---------------------------------------------------------------------------
# Longitudinal framework -- OW-001 complete.
#
# Read segment-by-segment from other map 4.jpg at 3x magnification against a
# calibrated 50 m grid. z is measured from the aft terminus, +Z toward fore.
#
# TWO CLASSES OF NUMBER, do not confuse them:
#   * table_*  -- from Miller's printed specification table. Authoritative.
#   * drawn_*  -- measured by me off his drawing. Inferential, +/- ~75 m real.
# Where they disagree the table wins; the drawing supplies ordering and the aft
# structures the table does not cover. See CONFLICTS.md C-006.
# ---------------------------------------------------------------------------
longitudinal:
  reading_uncertainty_real_m: 75
  features:
    # id                        drawn_z_start_m  drawn_z_end_m   (REAL metres)
    - {id: aft_terminus,              z0: 0,    z1: 39,   kind: terminus}
    - {id: primary_fusion_reactor,    z0: 39,   z1: 331,  kind: hull, label: J}
    - {id: reactor_spine,             z0: 331,  z1: 1095, kind: truss, label: K,
       contains: [reactor_coolant_purge_vents, reactor_coolant_storage_tanks]}
    - {id: generator_torus_housing,   z0: 1095, z1: 1295, kind: flare, label: L}
    - {id: main_truss_spine,          z0: 1295, z1: 2680, kind: truss, label: M,
       contains: [ionization_vane_support_rings, fusion_reactor_ionization_vanes]}
    - {id: explosive_disconnect_neck, z0: 2680, z1: 3016, kind: structural_boundary, label: O,
       note: "Reactor jettison boundary. Structurally significant -- everything aft of
              here detaches as one assembly."}
    - {id: hull_flare_aft,            z0: 3016, z1: 3107, kind: flare}
    # --- rotating assembly ---------------------------------------------------
    - id: green_section
      z0: 3107
      z1: 6035
      kind: rotating_assembly
      table_length_m: 2739.3
      geometric_length_m: 2928.0
      note: "Contains the bio-habitat drum. Liquid-helium linear bearings (label P)
             sit at the aft end; the banded assembly read at real z~4740 is the
             bearing race where non-rotating structure meets the drum.
             GEOMETRIC EXTENT (2928 m) EXCEEDS THE TABLE LENGTH (2739.3 m) BY 6.9%.
             This is C-006 surfacing as geometry: the table length placed z1 at 5846,
             but the habitat_cylinder subfeature -- read directly off the drawing --
             runs to 6035, leaving a 189 m unassigned gap the hull generator caught.
             A parent must contain its subfeatures, so the geometric extent governs
             mesh generation and the table value is retained for reference only.
             6.9% is the same order as the other drawing-vs-table disagreements
             (Red 5.7%, Green diameter 3.9%), so this is consistent error, not a
             new contradiction."
      subfeatures:
        - {id: aft_hull_block,   z0: 3107, z1: 4207, note: "Widest pressurised volume"}
        - {id: bearing_neck,     z0: 4207, z1: 4826}
        - {id: habitat_cylinder, z0: 4826, z1: 6035, label: T}
    # --- forward -------------------------------------------------------------
    - {id: red_section,               z0: 6035, z1: 6465, kind: hull,
       table_length_m: 445.3, drawn_length_m: 430,
       note: "Drawn and table lengths agree to 3.5% -- the strongest cross-check
              between Miller's drawing and his table."}
    - {id: forward_taper,             z0: 6465, z1: 6825, kind: cone}
    - {id: forward_waist,             z0: 6825, z1: 6939, kind: neck}
    - {id: docking_sphere,            z0: 6939, z1: 7286, kind: hull,
       contains: [spacecraft_fuel_storage, traffic_control_sensor_array,
                  cobra_launch_support_arms, spacecraft_bay_exhaust_vents]}
    - {id: forward_deflector_spike,   z0: 7286, z1: 8047, kind: spike, label: I}

# ---------------------------------------------------------------------------
# What this schema does NOT yet contain, and what unblocks it.
# ---------------------------------------------------------------------------
open_work:
  - id: OW-001
    need: "Longitudinal z-positions and radius profile for every section and exterior system"
    status: "Calibration DONE, segmentation read OUTSTANDING"
    calibration:
      # Established this session against other map 4.jpg (2100x1275).
      source: "reference/02-station-cutaways-and-plans/other map 4.jpg"
      tail_px: 71
      nose_px: 2048
      centreline_px_y: 388
      span_px: 1977
      miller_length_m: 3108
      px_per_miller_m: 0.6361
      miller_m_per_px: 1.572
      # To real scale: real_m = miller_m * 2.5891
      real_m_per_px: 4.070
    confirmed_correspondence:
      # Miller's stated Green Section outer length of 1058 m matches a single continuous
      # envelope on the drawing, and his Bio-Habitat interior length is also 1058 m.
      # The Green Section and the bio-habitat are therefore the same longitudinal extent:
      # Green Section IS the habitat drum. Real-scale length 2739.3 m.
      green_section_is_bio_habitat: true
    method: "Overlay the calibrated grid (tools/ script pattern in STATE.md), then read
             boundaries segment-by-segment at high magnification rather than in one pass.
             Gross structure reads as: aft reactor drum, thin spine with ionization vane
             rings, flared generator torus, wide aft hull block, habitat cylinder, forward
             docking structure, forward deflector spike. Exact boundaries NOT yet read --
             do not transcribe the approximations from the session log, re-read them.
             Do NOT use the Contract 5 sheet for dimensions, see CONFLICTS.md C-005."
    blocks: "Exterior hull generation"
  - id: OW-002
    need: "Grey, Brown and Yellow section dimensions"
    method: "Derive from OW-001 measurement as the remainder of the 8047 m budget."
    blocks: "Complete longitudinal framework"
  - id: OW-003
    need: "Resolution of C-003 (sector topology) and C-004 (level numbering)"
    method: "Additional reference: wayfinding signage, lift displays, deck plans."
    blocks: "ALL interior level geometry"

# ---------------------------------------------------------------------------
# Radius profile -- 1978 samples at 4.07 m spacing, station/schema/radius_profile.json
# Generated by station/extract_radius_profile.py from the Miller top view.
#
# This is the ENVELOPE radius: the outermost extent of the silhouette including
# flanges, racks and protrusions. It is NOT the pressure hull radius. Both are
# needed -- envelope for collision, silhouette and exterior geometry; pressure
# hull (from the table diameters) for interior volume. Do not conflate them.
# ---------------------------------------------------------------------------
radius_profile:
  file: "station/schema/radius_profile.json"
  kind: envelope
  samples: 1978
  spacing_m: 4.07
  max_radius_m: 480.3
  max_radius_at_z_m: 3610.3
  extraction:
    method: "Horizontal run-length filter (MIN_RUN=5 px) strips the ~26 label leader
             lines, which per-column outlier rejection cannot -- across wide stretches
             of the sheet the leaders outnumber the hull and so become the local median.
             Non-line-art regions (squadron badge, inset reactor photograph) are masked
             explicitly. Upper and lower halves are averaged to cancel one-sided bias."
    verified: "Visually, by overlaying the trace back onto the drawing and inspecting it."
  cross_check:
    # Envelope measured from the drawing vs. table diameters rescaled by k.
    # Independent of each other -- the agreement validates both the 0.6361 px/m
    # calibration and the k=2.5891 rescale.
    red_section:      {measured_d_m: 692.0, table_d_m: 654.9, agreement: "5.7%"}
    green_habitat:    {measured_d_m: 618.6, table_d_m: 595.5, agreement: "3.9%"}
    note: "Measured envelope reads consistently larger than the table, as expected --
           the envelope includes protrusions the pressure-hull figures exclude."
  finding:
    widest_structure: aft_hull_block
    envelope_diameter_m: 956.6
    at_z_m: 3600
    note: "The widest part of the station is the aft hull block, which Miller's table
           does not name at all. Larger than Red, Green or Blue. Any assumption that
           the Red Section is the station's widest point is wrong."

# ---------------------------------------------------------------------------
# Hull plating.
#
# The hull reads as assembled plating, not a smooth shell. The lathe radius is
# modulated per plate cell rather than modelling each plate as separate
# geometry, which would quadruple vertex count for detail invisible at station
# scale. Offsets are deterministic in (row, col) so regeneration is
# byte-identical -- without that the CI geometry check means nothing.
#
# depth_m is the real order for spacecraft plating. Large enough to read from a
# Starfury alongside, small enough not to disturb the silhouette.
# ---------------------------------------------------------------------------
hull_plating:
  enabled: true
  rows_per_plate: 16     # 16 x 4.07 m = ~65 m plate length
  segs_per_plate: 4      # 4 of 64 segments -- larger panels read as plating,
                         # smaller ones read as scales
  depth_m: 1.3
  min_radius_m: 40       # leave the thin spine and the nose spike smooth

# ---------------------------------------------------------------------------
# Non-axisymmetric components.
#
# The lathe produces the core hull only. Everything that makes the silhouette
# read as Babylon 5 rather than a smooth spindle lives here: radially arrayed
# fins and arrays, the communications grid, cobra bays, cargo modules.
#
# Z positions are cross-referenced three ways: the Exterior map ordering
# (auth 3), Miller's lettered callouts, and the envelope-excess analysis --
# a wide running minimum of the radius profile approximates the core hull, and
# where the envelope exceeds it by >25 m a structure protrudes. Agreement
# between the callout and an independent excess zone is what justifies each
# placement; where they agree the position is auth 3, where only the excess
# zone supports it, auth 5 with an INV entry.
# ---------------------------------------------------------------------------
components:
  - id: reactor_cooling_fin
    kind: planar_blades  # NOT radially arrayed -- see CONFLICTS.md C-007
    count: 6             # 3 above the spine, 3 below, all coplanar
    plane_deg: 0
    # Measured off the production sheet: a blade is ~7:1 span to max width, and
    # the three on a side sit close together with gaps about equal to their own
    # width. Earlier values were 3:1 and spread over 730 m, which read as three
    # separate paddles rather than one radiator bank.
    z0: 1315
    z1: 1655
    span_m: 470
    chord_m: 68          # 470/68 = 6.9:1
    root_taper: 0.5
    thickness_m: 14
    auth: 2
    src: "Exterior map.jpg 'Reactor Cooling Fins (12)'; excess zones 533-712 and 741-855"

  - id: heat_exchange_solar_array
    kind: swept_fins     # swept, not a radial pinwheel -- top view of exterior more.jpg
    count: 6
    segments: 4
    z0: 2020
    z1: 2330
    span_m: 470
    sweep_m: 430
    thickness_m: 13
    phase_deg: 30
    auth: 2
    src: "Exterior map.jpg 'Heat Exchange Arrays and Emergency Solar Collectors (12)';
          excess zone 1099-1510 peak 153 m"

  - id: comms_grid_pylon
    count: 2
    kind: pylon_pair
    z0: 2515
    z1: 2988
    span_m: 1060.25      # half of communications_grid.span_m = 2120.5
    grid_width_m: 893.2  # communications_grid.width_m
    panel_depth_m: 300   # radial depth, so the array reads as a grid not a crossbar
    thickness_m: 18
    auth: 3
    src: "Contract 5 'Deep Space Communications Grid (2)'; Miller callout B
          'Communications Grid Support Pylon'; excess zone 2515-2988 peak 177 m.
          Span and width from the specification table, rescaled by k."

  - id: cobra_bay
    count: 28
    kind: radial_band
    z0: 6980
    z1: 7250
    protrusion_m: 26
    width_m: 42
    auth: 3
    src: "Contract 5 'COBRA BAYS (28)'; Miller callout X 'Cobra Launch Bay Support Arm (4)';
          excess zone 7062-7302 peak 102 m. Count per CONFLICTS.md C-002."

  - id: cargo_module
    count: 42
    kind: dorsal_line    # a single dorsal row, not wrapped -- see 00-INDEX exterior more.jpg
    rows: 3              # 42 total across 3 meridians, 14 per row
    plane_deg: 90        # dorsal, i.e. on the +Y (North) meridian
    z0: 4870
    z1: 6010
    protrusion_m: 40
    width_m: 96
    fill: 0.74
    auth: 2
    src: "Miller callout U 'Cargo Module, Typical' on the habitat cylinder;
          count 28 rotating + 14 support structure from the specification table"

  # --- structures added after the orthographic sheet read ---------------------
  - id: observation_dome
    count: 2
    kind: domes
    rows: 2
    z0: 7000
    z1: 7240
    radius_m: 46
    height_m: 34
    phase_deg: 90
    auth: 3
    src: "Contract 5 'OB. DOME 1 (COMMAND & CONTROL)' and 'OB. DOME 2', on the
          forward docking structure. Dome 1 is C&C -- a place the player stands,
          so its position must survive into the interior layout."

  - id: observation_rotunda
    count: 4
    kind: domes
    rows: 1
    z0: 6180
    z1: 6360
    radius_m: 62
    height_m: 40
    auth: 3
    src: "Contract 5 'OBSERVATION ROTUNDA (4)'"

  - id: docking_port
    count: 2
    kind: domes
    rows: 1
    z0: 5150
    z1: 5330
    radius_m: 88
    height_m: 52
    phase_deg: 90     # +Y = North (primary) and -Y = South (service)
    auth: 3
    src: "Contract 5 cross-section: Primary Docking Port north, Service Docking Port south"

  - id: forward_swept_array
    count: 4
    kind: swept_fins
    z0: 6620
    z1: 6900
    span_m: 300
    sweep_m: 620
    thickness_m: 11
    phase_deg: 45
    auth: 2
    src: "reference/01-station-exterior/exterior more.jpg top view -- long swept
          structures on the forward section, edge-on in side view"

  - id: space_traffic_prox_array
    count: 4
    kind: swept_fins
    z0: 7320
    z1: 7420
    span_m: 190
    sweep_m: 300
    thickness_m: 8
    auth: 3
    src: "Exterior map.jpg 'Space Traffic Proximity Arrays'; Contract 5 count of 4"

# ---------------------------------------------------------------------------
# Procedural surface greebling.
#
# Detail scattered by rule over the hull skin -- vents, hatches, conduit runs,
# antenna stubs, blisters, cleats and marker lights. See station/greeble.py and
# docs/adr/0002-geometry-representation.md.
#
# What lives here is the part that is a claim about the station: which stretch
# of hull is finished passenger skin and which is exposed plant. The shapes and
# the mixture of kinds per tier live in the generator, because they are craft
# rather than canon. Every zone is auth 5 -- see INVENTIONS.md INV-006.
# ---------------------------------------------------------------------------
greebles:
  enabled: true
  seed: "b5-greeble-v1"        # changing this reshuffles every instance
  cell_m: 44                   # lattice cell; ~2/3 of a 65 m hull plate
  min_radius_m: 30             # thin spine tips and the nose stay bare
  max_slope: 0.9               # skip section-transition walls: |dr/dz| above this
  edge_pad_m: 30               # keep scattered detail inside its own section
  conduit_end_pad_m: 60        # runs stop short of a section joint
  beacon_ring_count: 6         # marker lights per structural boundary ring

  # Assemblies per km^2 of hull surface -- an assembly is one full-size fitting
  # plus its satellite hardware, so instance counts run 2-5x these numbers. The
  # spread between clean and industrial is deliberately wide, roughly 13x,
  # because on the orthographic sheet the difference between the bare drum skin
  # and the reactor section is the clearest thing about the surface treatment.
  tiers:
    minimal:    {per_km2: 8}
    clean:      {per_km2: 26}
    standard:   {per_km2: 42}
    cluttered:  {per_km2: 88}
    industrial: {per_km2: 105}

  zones:
    - {feature: aft_terminus,              tier: minimal,    conduit_runs: 0}
    - {feature: primary_fusion_reactor,    tier: industrial, conduit_runs: 6}
    - {feature: reactor_spine,             tier: industrial, conduit_runs: 8}
    - {feature: generator_torus_housing,   tier: industrial, conduit_runs: 5}
    - {feature: main_truss_spine,          tier: industrial, conduit_runs: 6}
    - {feature: explosive_disconnect_neck, tier: industrial, conduit_runs: 3}
    - {feature: hull_flare_aft,            tier: industrial, conduit_runs: 2}
    - {feature: aft_hull_block,            tier: cluttered,  conduit_runs: 5}
    - {feature: bearing_neck,              tier: standard,   conduit_runs: 3}
    - {feature: habitat_cylinder,          tier: clean,      conduit_runs: 6}
    - {feature: red_section,               tier: clean,      conduit_runs: 2}
    - {feature: forward_taper,             tier: standard,   conduit_runs: 2}
    - {feature: forward_waist,             tier: standard,   conduit_runs: 2}
    - {feature: docking_sphere,            tier: standard,   conduit_runs: 2}
    - {feature: forward_deflector_spike,   tier: minimal,    conduit_runs: 0}
  zones_src: >
    Tier assignment from reference/01-station-exterior/exterior more.jpg
    (orthographic production sheet, auth 2), which shows exposed plant, grille
    banks and rails across the reactor and spine sections and a comparatively
    finished skin over the habitat drum. Aft-hull-block is tiered `cluttered`
    per INVENTIONS.md INV-006; it is provisional and does not constrain
    anything downstream. Rates per km^2 are auth 5 throughout.

# ---------------------------------------------------------------------------
# Interior topology.
#
# ESTABLISHED by other map.png (authority 3, six sector rosettes) and
# independently corroborated by authority-1 footage of the drum end cap
# (Babylon_5_2-22_34b.jpg). See canon/CONFLICTS.md C-004 UPDATE.
#
# What the rosettes establish, with confidence:
#   * Sectors are CONCENTRIC ANNULAR RINGS about a central core, not
#     longitudinal slices. This closes the axis question in C-004.
#   * Radial "transport tubes" run as spokes from the outer rings to the axis.
#   * The core shuttle and power core run ON the axis.
#   * No longitudinal subdivision is drawn in any rosette.
#
# What they do NOT establish: ring COUNT or ring RADII. The sheet is 660x414
# and a rosette is ~120 px across; a radial intensity trace gives roughly three
# to four bands but the boundaries blur under angular averaging, and reading
# exact radii off it would be over-reach. Ring boundaries below are therefore
# PROVISIONAL fractions of the sector's outer radius, not measurements.
# ---------------------------------------------------------------------------
interior_topology:
  model: concentric_rings
  src: "other map.png sector rosettes; corroborated by Babylon_5_2-22_34b.jpg"
  auth: 3
  core_on_axis: [power_core, core_shuttle]
  spokes:
    kind: transport_tube
    note: "Radial, outer ring to axis. Green's rosette shows only three, which is
           notably fewer than the other sectors -- consistent with its large
           hollow interior volume (the Garden) needing fewer crossings."

  # PROVISIONAL. Fractions of sector outer radius, outermost first.
  # Not measured -- see the note above. Gravity falls linearly with radius, so
  # ring 1 is full weight and inner rings are progressively lighter, which is a
  # design consequence worth preserving whatever the true radii turn out to be.
  provisional_rings:
    - {id: ring_1, r_outer: 1.00, r_inner: 0.82, note: "Outermost, highest gravity"}
    - {id: ring_2, r_outer: 0.82, r_inner: 0.60}
    - {id: ring_3, r_outer: 0.60, r_inner: 0.38}
    - {id: ring_4, r_outer: 0.38, r_inner: 0.18}
    - {id: core,   r_outer: 0.18, r_inner: 0.00, note: "Power core and core shuttle"}

  # Facilities read directly off the rosette labels. Ring assignment is only
  # given where a leader line clearly lands on a band; the rest are recorded
  # without a ring rather than guessed into one.
  sector_facilities:
    red:    [zocalo, earharts, central_corridor, waste_management, casino,
             dark_star, law_courts, security_central, business_district, water_storage]
    green:  [alien_sector, council_chamber, fresh_air_restaurant, earthforce_office,
             zen_garden, hydroponics, waste_management, power_conduits]
    blue:   [central_docking_hub, medlab_one, observation_rotundas, fuel_stores,
             mess_hall, bay_elevators, dock_workers_quarters, quartermasters_office,
             docking_bays, post_office, maintenance_facilities]
    brown:  [downbelow, happy_daze, waste_management_control, power_core]
    grey:   [atmosphere_monitoring, commercial_research_labs, fabrication_furnaces,
             maintenance_and_repair, primary_breaker, alpha_power_substation]
    yellow: [power_transfer_core, cooling_fins, coolant_transfer_tubes,
             inspection_access]
