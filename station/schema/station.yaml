  - {id: reactor_coolant_purge_vent, count: 1,  auth: 4}
  - {id: fuel_delivery_venting,      count: 1,  auth: 3}
  - {id: reactor_cooling_fin,        count: 12, auth: 3}
  - {id: explosive_disconnect_point, count: 1,  auth: 4}
  - {id: generator_torus_housing,    count: 1,  auth: 4}
  - {id: heat_exchange_solar_array,  count: 12, auth: 3}
  - {id: secondary_power_conduit,    count: 1,  auth: 3}
  - {id: raw_material_storage_bay,   count: 5,  auth: 3}
  - {id: habitat_cylinder,           count: 1,  auth: 3}
  - {id: micro_gravity_maint_bay,    count: 2,  auth: 3}
  - {id: hazardous_liquid_tank,      count: 1,  auth: 3}
  - {id: inert_gases_tank,           count: 4,  auth: 3}
  - {id: cargo_module,               count: 42, auth: 4}   # 28 rotating + 14 support structure
  - {id: deep_space_comms_grid,      count: 2,  auth: 3}
