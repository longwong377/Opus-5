# Babylon 5 — Parametric Station Schema
#
# THE authoritative description of the station. Exterior hull, interior shells, collision,
# navmesh and occlusion portals are all generated from this file, which is what makes inside
# and outside consistent by construction. See docs/adr/0003-parametric-station-schema.md
#
# Every dimension carries `src` (reference file or canon rule) and `auth` (authority level
# 1-5, see canon/00-MASTER.md). Anything with auth 5 must have an INV- entry.
#
# Schema version 1: exterior longitudinal framework complete; interior topology established
# as concentric rings (see interior_topology). Interior LAYOUT still blocked pending
# canon/CONFLICTS.md C-003 and C-004 -- specifically the level numbering convention.

meta:
  schema_version: 1
  era: "S2-S3"
  canon_master: "canon/00-MASTER.md"
  units: metres

# ---------------------------------------------------------------------------
# Coordinate convention -- fixed, do not change without an ADR.
# ---------------------------------------------------------------------------
# Z  station long axis. +Z toward FORE (docking sphere / C&C end).
#    Origin z=0 at the AFT terminus (outboard face of the core fuel housing).
#    Station occupies z in [0, 8047].
# Y  lateral. +Y = NORTH, -Y = SOUTH, per the Contract 5 cross-section convention.
# X  lateral, completing a right-handed frame.
# Rotation is about +Z. Spin gravity points radially OUTWARD (away from the axis);
# "down" for anyone standing in the habitat drum is therefore +radial.

frames:
  inertial: "SIF"          # station inertial frame; non-rotating, origin at station centre of mass
  rotating: "SRF"          # co-rotating with the habitat drum; fictitious forces applied in-frame
  axis: [0, 0, 1]

# ---------------------------------------------------------------------------
# Global properties
# ---------------------------------------------------------------------------
station:
  overall_length_m:   {value: 8047,      src: "S1 opening narration; other map 2.jpg", auth: 1}
  mass_tons:          {value: 2500000,   src: "S2 opening narration",                  auth: 1}
  population_typical: {value: 250000,    src: "S1 opening narration",                  auth: 1}
  crew_earthforce:    {value: 6500,      src: "other map 2.jpg",                       auth: 4}
  location:           {value: "Mid-orbit, Epsilon Eridani III, Euphrates Sector", src: "show; other map 2.jpg", auth: 1}

  rotation:
    # Derived: 1.0 g at the habitat floor radius fixes the rate exactly. See INV-002.
    target_g_at_habitat_floor: {value: 1.0,      src: "show depicts normal gait", auth: 1}
    habitat_floor_radius_m:    {value: 278.3,    src: "derived, INV-001",         auth: 5}
    # Carried to 9 places. Rounding omega to 5 places put floor gravity at
    # 1.000351 g and shifted the half-gravity radius by 5 cm -- small, but the
    # physics tests assert exact relations and rounding noise fails them for the
    # wrong reason. Standard gravity is 9.80665 m/s^2 throughout.
    standard_gravity_m_s2:     {value: 9.80665,      src: "CODATA",                   auth: 1}
    omega_rad_s:               {value: 0.187717056,  src: "derived: sqrt(g0/r)",      auth: 5}
    period_s:                  {value: 33.471574,    src: "derived: 2*pi/omega",      auth: 5}
    rpm:                       {value: 1.792566,     src: "derived: 60/period",       auth: 5}
    # Sanity: 1.79 rpm is below the ~2-3 rpm human Coriolis tolerance threshold.

  # Rescaling rule applied to every Miller-derived dimension. See CONFLICTS.md C-001.
  miller_rescale_k: {value: 2.5891, src: "8047 / 3108", auth: 5}

# ---------------------------------------------------------------------------
# Pressurised sections -- dimensions rescaled from other map 4.jpg (Miller). INV-001.
# ---------------------------------------------------------------------------
sections:
  blue:
    diameter_m: {value: 520.4, src: "other map 4.jpg x k", auth: 4}
    length_m:   {value: 921.7, src: "other map 4.jpg x k", auth: 4}
    function:   "Docking sphere, crew quarters, Command & Control"
    rotating:   true
  red:
    diameter_m: {value: 654.9, src: "other map 4.jpg x k", auth: 4}
    length_m:   {value: 445.3, src: "other map 4.jpg x k", auth: 4}
    function:   "Commercial zones, residential, the Zocalo"
    rotating:   true
  green:
    outer_diameter_m: {value: 595.5,  src: "other map 4.jpg x k", auth: 4}
    outer_length_m:   {value: 2739.3, src: "other map 4.jpg x k", auth: 4}
    function:         "Diplomatic zones, the Garden"
    rotating:         true
  # Grey, Brown and Yellow have NO dimensional source. Blocked -- see open_work below.

bio_habitat:
  interior_diameter_m:   {value: 556.6,     src: "other map 4.jpg x k",  auth: 4}
  interior_radius_m:     {value: 278.3,     src: "derived",              auth: 5}
  interior_length_m:     {value: 2739.3,    src: "other map 4.jpg x k",  auth: 4}
  interior_surface_m2:   {value: 4787500,   src: "other map 4.jpg x k^2", auth: 4}
  # Cross-check: pi * 556.6 * 2739.3 = 4789000 m^2. Agrees to 0.03%.

communications_grid:
  span_m:  {value: 2120.5, src: "other map 4.jpg x k", auth: 4}
  width_m: {value: 893.2,  src: "other map 4.jpg x k", auth: 4}
  count:   {value: 2,      src: "Contract 5",          auth: 3}

# ---------------------------------------------------------------------------
# Sector model -- PROVISIONAL, see CONFLICTS.md C-003 (BLOCKING for interiors)
# ---------------------------------------------------------------------------
sectors:
  # C-003 RESOLVED. The Security Manual Sectional Schematic brackets sectors along
  # the station's length while drawing decks as concentric rings, so both readings
  # were right about different axes: sectors are LONGITUDINAL, levels are RADIAL.
  #
  # Extents below are read from the bracket ticks on that sheet as fractions of
  # station length. The sheet has no scale bar, so absolute values come from
  # applying those fractions to the canon 8,047 m. Cross-checked independently
  # against the Miller-derived longitudinal framework: Green agrees to 11.7%,
  # Red to 14.1%, from two unrelated sources by two unrelated methods.
  model: longitudinal
  src: "b5-schematics-from-the-security-manual-v0-u8879zcrf36h1.webp Sectional Schematic"
  auth: 3
  order_aft_to_fore: [yellow, grey, green, red, blue]
  extents_m:
    yellow: {z0: 0,    z1: 3397, frac: [0.000, 0.422]}
    grey:   {z0: 3397, z1: 3839, frac: [0.422, 0.477]}
    green:  {z0: 3839, z1: 6425, frac: [0.477, 0.798]}
    red:    {z0: 6425, z1: 6794, frac: [0.798, 0.844]}
    blue:   {z0: 6794, z1: 8047, frac: [0.844, 1.000]}
  # Brown is NOT bracketed on the sheet. "Down-Below" is labelled on the outer
  # band in the Green region, and the Brown rosette marks DOWNBELOW spanning an
  # outer annular band. Treated as a radial designation. INV-009.
  brown:
    kind: radial_designation
    ring: outermost
    auth: 5
    src: "INV-009 -- inference from two sources placing it radially, not longitudinally"
  order_aft_to_fore_LEGACY: [grey, brown, green, red, yellow, blue]
  definitions:
    grey:   {function: "Industrial zones, manufacturing, construction", src: "other map 2.jpg", auth: 4}
    brown:  {function: "Residential -- Downbelow",                      src: "other map 2.jpg", auth: 4}
    green:  {function: "Diplomatic zones, the Garden",                  src: "other map 2.jpg", auth: 4}
    red:    {function: "Commercial zones, residential, the Zocalo",     src: "other map 2.jpg", auth: 4}
    yellow: {function: "Zero-G storage",                               src: "other map 2.jpg", auth: 4}
    blue:   {function: "Docking sphere, crew quarters, C&C",           src: "other map 2.jpg", auth: 4}
  addressing:
    # On-screen references take the form "<Colour> <number>": Grey 17, Red 3, Blue 12.
    format: "<sector> <level>"
    # RESOLVED as radial by the sector rosettes in other map.png, corroborated
    # by authority-1 footage of the drum end cap. See interior_topology below
    # and CONFLICTS.md C-004 UPDATE. What is still open is the numbering
    # CONVENTION -- whether level 1 is the outermost ring or the innermost --
    # which is why C-004 stays BLOCKING on narrower grounds.
    level_axis: radial

