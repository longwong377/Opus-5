name: canon-validation

# There is no human reviewing intermediate work and no GPU in the build
# container, so every claim that can be checked numerically is checked here on
# every push. A canon violation fails the build.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pyyaml numpy pillow

      - name: Regenerate geometry from the schema
        run: |
          cd station
          python3 generate_hull.py

      - name: Export glTF and verify it is well-formed
        run: |
          python3 station/export_gltf.py
          python3 - <<'PY'
          import json, struct
          d = open("station/generated/station.glb","rb").read()
          magic, ver, total = struct.unpack("<III", d[:12])
          assert magic == 0x46546C67 and ver == 2 and total == len(d)
          jlen, jtype = struct.unpack("<II", d[12:20])
          g = json.loads(d[20:20+jlen])
          blen, btype = struct.unpack("<II", d[20+jlen:28+jlen])
          assert g["buffers"][0]["byteLength"] == blen
          for a in g["accessors"]:
              bv = g["bufferViews"][a["bufferView"]]
              stride = {"VEC3": 12, "SCALAR": 4}[a["type"]]
              assert a["count"] * stride <= bv["byteLength"]
              assert bv["byteOffset"] + bv["byteLength"] <= blen
          print(f"glb valid: {len(g['meshes'])} meshes")
          PY

      - name: Performance budgets
        run: python3 station/budget.py

      - name: Canon assertions
        run: python3 station/validate.py

      # The kit's gates assert two things a render cannot be trusted to show:
      # that primitives face outward, and that a corridor is closed overhead.
      # Both have already been wrong in committed geometry, and both looked
      # like shading against a black background rather than like holes.
      - name: Interior kit self-test
        run: |
          cd station
          python3 interior_kit.py

      # Ring/deck radii, spin gravity per deck, and the drum's inverted winding.
      # The winding one matters most: the drum is the only surface in the
      # project seen from its concave side, so the hull's convention is wrong
      # there, and getting it wrong renders black rather than erroring.
      - name: Interior topology and drum self-test
        run: |
          cd station
          python3 interior.py

      # The manifest is the engine's streaming index. Regenerating it in CI
      # means a schema change that alters deck radii, cell counts or cell cost
      # shows up as a diff rather than as a stale file nobody reran.
      # The drum's fill: ground heightfield, tram and axial tube. None of these
      # was wired into anything when it landed, so nothing would have noticed
      # them breaking.
      - name: Drum ground, tram and core tube
        run: |
          cd station
          python3 drum_ground.py
          python3 tram.py
          python3 core_tube.py

      # Interiors that are places rather than kit: the station's social centre
      # and the room the launch-and-dock requirement lands in.
      - name: Zocalo and docking bay
        run: |
          cd station
          python3 zocalo.py
          python3 docking_bay.py
          python3 signage.py
          python3 plant.py
          python3 customs.py
          python3 garden.py
          python3 alien_sector.py
          python3 quarters.py
          python3 command_control.py
          python3 council_chamber.py

      - name: Streaming cell manifest
        run: |
          cd station
          python3 -c "import interior as I; s,p=I.load(); m=I.write_cell_manifest('generated/cell_manifest.json',s,p); print(m['decks'],'decks',m['cells'],'cells')"
          git diff --exit-code generated/cell_manifest.json

      - name: Rotating-frame physics
        run: python3 station/physics/test_rotating_frame.py

      - name: Precision and floating origin
        run: python3 station/physics/test_floating_origin.py

      - name: Starfury flight model
        run: python3 station/physics/test_starfury.py

      # The mesh and the flight model hold separate copies of the thruster
      # layout so that editing one and not the other fails loudly. That gate is
      # worthless unless it runs, and it only runs here.
      - name: Starfury airframe, and that it still agrees with the flight model
        run: |
          python3 station/starfury_geometry.py
          python3 station/test_starfury_geometry.py

      - name: Docking
        run: python3 station/physics/test_docking.py

      - name: Core shuttle and radial transit
        run: python3 station/physics/test_core_shuttle.py

      - name: NPC names
        run: python3 station/npc/test_names.py

      - name: NPC schedules
        run: python3 station/npc/test_schedule.py

      # Bodies, costume and crowd. `body.py` carries its own closure gates --
      # signed volume, an edge census and a ray-parity `contains()` -- because
      # the first lineup render showed limbs detached from the torso and no
      # existing gate could see it. Those gates only protect anything if they
      # run here.
      - name: NPC bodies, costume and crowd
        run: |
          cd station/npc
          python3 body.py
          python3 costume.py
          python3 crowd.py

      # Animation and navigation are the two that touch station geometry, so
      # they are the two a schema change can silently break. Slowest gates in
      # the project at ~24 s and ~77 s; both are worth it.
      - name: NPC animation and navigation
        run: |
          cd station/npc
          python3 animation.py
          python3 navigation.py

      - name: Confirm the schema still parses and is fully sourced
        run: |
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open("station/schema/station.yaml"))
          # Every auth-5 value is an extrapolation and must be logged as an
          # invention, or canon and guesswork have started to blur.
          inv = open("canon/INVENTIONS.md").read()
          missing = []
          def walk(node, path=""):
              if isinstance(node, dict):
                  if node.get("auth") == 5 and "src" in node:
                      pass
                  for k, v in node.items():
                      walk(v, f"{path}.{k}")
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, f"{path}[{i}]")
          walk(d)
          for tag in ("INV-001", "INV-002", "INV-003"):
              if tag not in inv:
                  missing.append(tag)
          if missing:
              print("missing invention entries:", missing); sys.exit(1)
          print("schema parses; invention log intact")
          PY
