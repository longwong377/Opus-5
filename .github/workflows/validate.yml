name: canon-validation

# There is no human reviewing intermediate work and no GPU in the build
# container, so every claim that can be checked numerically is checked here on
# every push. A canon violation fails the build.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pyyaml numpy pillow

      - name: Regenerate geometry from the schema
        run: |
          cd station
          python3 generate_hull.py

      - name: Export glTF and verify it is well-formed
        id: sexport_gltf_and_verify_it_is_well_formed
        continue-on-error: true
        run: |
          python3 station/export_gltf.py
          python3 - <<'PY'
          import json, struct
          d = open("station/generated/station.glb","rb").read()
          magic, ver, total = struct.unpack("<III", d[:12])
          assert magic == 0x46546C67 and ver == 2 and total == len(d)
          jlen, jtype = struct.unpack("<II", d[12:20])
          g = json.loads(d[20:20+jlen])
          blen, btype = struct.unpack("<II", d[20+jlen:28+jlen])
          assert g["buffers"][0]["byteLength"] == blen
          for a in g["accessors"]:
              bv = g["bufferViews"][a["bufferView"]]
              stride = {"VEC3": 12, "SCALAR": 4}[a["type"]]
              assert a["count"] * stride <= bv["byteLength"]
              assert bv["byteOffset"] + bv["byteLength"] <= blen
          print(f"glb valid: {len(g['meshes'])} meshes")
          PY

      # THIS STEP IS EXPECTED RED, and saying so here is the point. Session 3w
      # replaced budget.py's synthetic visible-set estimate with a real frustum
      # sweep over the assembled deck, and the estimate had been 3.2x optimistic:
      # three content bounds went over the moment they were measured honestly.
      # The remedy is to move the content, not the limit. `--no-deck` is the only
      # honest lever if this has to pass for an unrelated reason, and it prints a
      # banner saying the one gate that measures what a player renders was
      # skipped. It also now costs ~62 s rather than 2 s, because measuring a
      # frame means building one.
      - name: Nothing unreachable (no engine needed)
        id: sreachable
        continue-on-error: true
        run: python3 station/coldstart.py --g3

      - name: Can anybody start it
        id: scoldstart
        continue-on-error: true
        run: python3 station/coldstart.py

      # WHO MAY STAND WHERE, in the shipped scene. `consequence.certain_check`
      # has decided this since P1-G2 and had no runtime caller -- the eleventh
      # time this project has finished a thing nothing calls. The gate walks a
      # body across every place boundary the build actually has; its four
      # controls (`--no-checks`, `--tier=0`, `--tier=5`, `--no-hud`) each move
      # the verdict, so it can still fail.
      - name: The card is read on the way in
        id: scardcheck
        continue-on-error: true
        run: python3 station/coldstart.py --g4

      # THE BODY: 16 segments, mass from the mesh's own volume split by its own
      # skin weights, joint frames from `animation._skeleton`.
      - name: Ragdolls -- the body that stops standing up
        id: sragdoll
        continue-on-error: true
        run: |
          cd station/npc
          python3 ragdoll.py --gate

      # AND WHETHER THE GAME EVER ASKS FOR ONE. `incident.py` decided 380
      # collapses a day into a ledger nothing read, and `ragdoll.gd` could drop
      # a body only when a gate flag asked it to -- two finished halves with
      # nothing between them. G5 asserts the join in the shipped scene; its two
      # controls (`--no-collapses`, `--no-ragdoll`) each stop the body falling.
      - name: Somebody collapses and a player is there
        id: scollapse
        continue-on-error: true
        run: python3 station/coldstart.py --g5

      # THE FIELD A PLAYER FALLS IN. Nothing set `gravity_m_s2`, so the 9.81
      # export default stood and the shipped player fell 31.6% too fast at every
      # angle on a deck delivering 7.4523. Measured at 18 ring angles, by
      # dropping the body and reading acceleration off the velocity -- a
      # constant cannot fake g = omega^2 r. Two controls, both shown failing.
      - name: The field is right all the way round the ring
        id: sgravity
        continue-on-error: true
        run: python3 station/coldstart.py --g6

      # AND YOU WALK AROUND THE CASUALTY. Control: 0.420 m inside the body.
      - name: A player walks around a body, not through it
        id: scorpse
        continue-on-error: true
        run: python3 station/coldstart.py --g7

      # SLEEP AND WAIT RUN THE WORLD RATHER THAN SKIPPING IT. PLY-05: "advance
      # the station clock at compressed rate THROUGH THE RUNNING SIMULATION --
      # events still fire, stocks still move, the world does not pause." What
      # shipped was one `Clock.set_hour` and the seven hours between lying down
      # and waking never happened.
      - name: A sleep runs the world it sleeps through
        id: scompress
        continue-on-error: true
        run: python3 station/compress.py --selftest

      # HUNGER AND FATIGUE, AS A RHYTHM RATHER THAN A RESOURCE BAR. PLY-06's
      # own harness is a WHOLE-STATE DIFF against a fed-and-rested control,
      # because a checklist can only fail for a missing effect and the failure
      # mode a mild system actually has is growing an extra one. The self-test
      # therefore plants an undeclared effect key and asserts the diff sees it.
      - name: Hunger and fatigue are exactly two effects and no more
        id: scondition
        continue-on-error: true
        run: python3 station/condition.py --selftest

      # SAVE, WALK AWAY, LOAD, AND CHECK YOU CAME BACK. The first save system
      # this project has had -- before it, closing the game restarted the clock
      # at 13:00, refilled every shop and reset every purse.
      #
      # THE AUDIT LINE IS AS LOAD-BEARING AS THE VERDICT. A save system that
      # quietly saves four of nine subsystems is indistinguishable, in every
      # test, from one that saves all nine, so `save.gd::audit` names every live
      # subsystem that cannot save on every capture -- and a subsystem with
      # nothing to save has to DECLARE that, with a reason, or it counts as
      # outstanding. Currently 4 savable + 5 exempt with reasons + 0 silent.
      - name: Save, walk away, load, and check you came back
        id: ssave
        continue-on-error: true
        run: python3 station/coldstart.py --g8

      # WHAT THE PLAYER KNOWS -- SYS-16's knowledge items, CAST-05's memory and
      # standing, and PLY-05's compression. `docs/MASTER-PLAN.md` R7 counted the
      # journal ten times in the spec and zero times in the plan, and its own
      # argument for building it beside the save is one line: *"a journal with
      # no save is a notebook that forgets"*.
      #
      # THE SELF-TEST IS THE PART CI CAN RUN. The acceptance test --
      # `python3 station/journal.py --gate` -- launches Godot three times per
      # case (learn, QUIT, recall) and needs a BUILT deck, which CI has never
      # had; it is skipped here rather than faked, and `--gate` says SKIP with
      # the command that would fix it. What runs is the 32 offline checks and
      # the manifest emit, which is also what keeps `station/generated/
      # journal.json` reproducible -- `tools/wiring.py` reported it as "on disk
      # but not rebuilt by CI" until this step existed, which is the committed-
      # artefact staleness defect this repository has now had four times.
      - name: The journal, its refusals, and the id GDScript must agree with
        id: sjournal
        continue-on-error: true
        run: |
          python3 station/journal.py --selftest
          python3 station/journal.py --emit

      # C&C READS AND ACTS ON REAL STATION STATE. `plant_systems` gained a
      # failure model in 4q and `grep -c 'cnc' station/plant_systems.py` was
      # ZERO -- the room whose whole purpose is watching the station watched
      # nothing. Nine desks derived from SYSTEM_KEYS + the register's own
      # functions, seated by time-to-consequence; four orders that CALL the
      # function implementing them; three states that are wear_at's own.
      - name: The C&C watch floor
        id: scnc_ops
        continue-on-error: true
        run: python3 station/cnc_ops.py --gate

      - name: Command and Control
        id: scommand_control
        continue-on-error: true
        run: python3 station/command_control.py

      # HARD RULE 2 HAD NO GATE. `canon/INVENTIONS.md` is the register of every
      # declared extrapolation and the modules cite it by number; a citation
      # with nothing behind it looks exactly like a sourced value, which is the
      # one thing hard rule 1 forbids. On its first run this found TWO NUMBERS
      # MEANING TWO THINGS EACH -- INV-450 was both the ragdoll's settle
      # threshold and a farm hedge's height -- because two agents in one session
      # were each given a reserved block and nothing checked the blocks against
      # each other. The session-4q collisions are closed, and so are the five
      # dangling citations this step was RED on since the day it was written
      # (INV-074/078/140/141/232) -- each was already argued carefully in the
      # file that cited it and simply had no entry for a reader to land on.
      # GREEN as of 4r: 306 entries, 194 numbers cited. "Pre-existing" is a
      # description, not an exemption; hard rule 2 does not have a grandfather
      # clause.
      - name: Every INV cited in code is defined
        id: sinv_register
        continue-on-error: true
        run: python3 tools/inv_check.py

      - name: The circulation network -- can you get from here to there
        id: scirculation
        continue-on-error: true
        run: python3 station/routes.py --selftest

      # THE WALL A PLAYER CAN TOUCH AGAINST THE WALL A PLAYER CAN SEE. Every
      # gate here measures one artefact against a standard of its own kind, so
      # a room's render mesh and its collision shell could disagree by any
      # amount and stay green -- and in 20 of the 32 composed rooms they do.
      # ~7 minutes: it builds every composed module, because the only honest
      # source for "how wide is this room" is the geometry.
      #
      # IT ASKS CONTAINMENT, NOT WIDTH, and `kosh_quarters` is the proof that
      # those are different questions: 10.22 m of shell for a 10.66 m mesh is
      # 95.9% and passes any width test, while the mesh runs -2.25 .. +8.41 m
      # because `bespoke.room_shell` centres x on the DOORWAY -- so 3.30 m of
      # that room is outside a shell of the right size.
      - name: The collision shell is the room
        id: sshellfit
        continue-on-error: true
        run: python3 station/deck.py --shell-fit

      # THE QUALITY BAR ITSELF HAD NEVER RUN IN CI. `docs/aaa-scorecard.json` is
      # the layer-8 authority -- the file that decides whether a subsystem may
      # stop being reworked -- and nothing checked its shape, so a round could
      # cite a descriptor that does not exist, score a dimension with no
      # evidence, or lose its findings to a typo, and the dashboard would still
      # print. The gate's own self-test runs first because a broken gate scoring
      # a scorecard is worse than no gate: it prints a table.
      #
      # IT IS RED, AT 91 STRUCTURAL ERRORS, AND THAT IS THE POINT OF LANDING IT.
      # Most are seed rounds written before the coupling rules existed -- a score
      # below the bar with no finding explaining WHY it is below the bar. Every
      # one is a review that cannot be acted on. The number is the work-list.
      - name: The AAA gate can score itself
        id: saaa_selftest
        continue-on-error: true
        run: python3 tools/aaa_gate.py

      - name: The quality bar -- may any subsystem stop
        id: saaa_scorecard
        continue-on-error: true
        run: python3 tools/aaa_gate.py docs/aaa-scorecard.json

      - name: Performance budgets
        id: sperformance_budgets
        continue-on-error: true
        run: python3 station/budget.py

      # THE OCCLUDER, AND THE ONE PROPERTY THAT MATTERS. `station/occluders.py`
      # was 630 lines that nothing imported -- `tools/wiring.py --callers` found
      # it, the eighth instance in this project of finished machinery with no
      # caller on the shipped path -- and its own self-test shipped RED at 6/7
      # with 209 containment breaches. It is 9/9 now, it has three importers,
      # and it runs here because AN OVER-OCCLUDING OCCLUDER IS INVISIBLE IN A
      # STILL FRAME: it is a hole in the world that only appears when the camera
      # moves, which is the one class of defect this project's render path
      # cannot see.
      #
      # Five controls, all shown firing: the collision shell used as an occluder
      # (1,974 breaches), the ray-measured profile this module shipped with
      # (209), an unwidened aperture (2, and 0 at 64 directions -- see the note
      # in the file), a sealed occluder (34), and the blocked ray cast against
      # the scalar one it replaced.
      #
      # ~60 s. The four-minute ray lattice is `--rays` and is deliberately NOT
      # run here: it cannot change the profile, because no cast can leave the
      # kit's own vertex box (INV-370).
      - name: Occluders hide nothing visible
        id: soccluders
        continue-on-error: true
        run: python3 station/occluders.py --selftest

      # SEPARATE, because it asks a different question and must stay green.
      # `RING_DECK_COLLISION_TRIS` is a cache of a 60 s whole-station sweep, and
      # a cache that can go stale silently is a second copy of a computed number.
      # `--no-deck` keeps this step to the drift check rather than re-running the
      # frame budget above.
      - name: Whole-station collision total has not drifted
        id: swhole_station_collision_total_has_not_dr
        continue-on-error: true
        run: python3 station/budget.py --station --no-deck

      - name: Canon assertions
        id: scanon_assertions
        continue-on-error: true
        run: python3 station/validate.py

      # The hull apertures. `generate_hull.py` already runs `check_closure` on
      # every build, so the closure PROPERTY is gated -- but the three negative
      # controls that prove the check can fail live only in this self-test, and
      # a closure assertion nobody can break is the pattern this project has
      # been bitten by twice.
      - name: Hull apertures and their closure
        id: shull_apertures_and_their_closure
        continue-on-error: true
        run: python3 station/aperture.py

      # The kit's gates assert two things a render cannot be trusted to show:
      # that primitives face outward, and that a corridor is closed overhead.
      # Both have already been wrong in committed geometry, and both looked
      # like shading against a black background rather than like holes.
      - name: Interior kit self-test
        id: sinterior_kit_self_test
        continue-on-error: true
        run: |
          cd station
          python3 interior_kit.py

      # Ring/deck radii, spin gravity per deck, and the drum's inverted winding.
      # The winding one matters most: the drum is the only surface in the
      # project seen from its concave side, so the hull's convention is wrong
      # there, and getting it wrong renders black rather than erroring.
      - name: Interior topology and drum self-test
        id: sinterior_topology_and_drum_self_test
        continue-on-error: true
        run: |
          cd station
          python3 interior.py

      # The manifest is the engine's streaming index. Regenerating it in CI
      # means a schema change that alters deck radii, cell counts or cell cost
      # shows up as a diff rather than as a stale file nobody reran.
      # The drum's fill: ground heightfield, tram and axial tube. None of these
      # was wired into anything when it landed, so nothing would have noticed
      # them breaking.
      - name: Drum ground, tram and core tube
        id: sdrum_ground_tram_and_core_tube
        continue-on-error: true
        run: |
          cd station
          python3 drum_ground.py
          # WHAT STANDS ON THE GROUND `drum_ground.py` MAKES. judge-4e against
          # `docs/judge-4e-drum-half.png`: "no vegetation, no props, no people,
          # no relief, nothing standing anywhere on 4.5 million m2", with
          # 183,880 triangles of headroom explicitly unspent. 1,945 features
          # in 12 kinds, LOD-resolved against the same eye the ground is.
          python3 drum_dressing.py
          python3 tram.py
          python3 core_tube.py

      # Interiors that are places rather than kit: the station's social centre
      # and the room the launch-and-dock requirement lands in.
      - name: Zocalo and docking bay
        id: szocalo_and_docking_bay
        continue-on-error: true
        run: |
          cd station
          python3 zocalo.py
          python3 docking_bay.py
          python3 signage.py
          python3 plant.py
          python3 customs.py
          python3 garden.py
          python3 alien_sector.py
          python3 quarters.py
          python3 hospitality.py
          python3 command_control.py
          python3 council_chamber.py

      # Layer 2: the 68 addressed locations with no bespoke module. Its gates
      # are the ones nothing else in the project has: that every prop a
      # location DECLARES exists as geometry, that no two solids in a room
      # occupy the same cubic metre, and that a walker can still cross the
      # floor. The last two caught defects on their first run -- a monitor
      # wall swallowing a cell door, and a racking run standing in front of
      # the only way into a cargo bay.
      #
      # `directory.py` runs after it because its layer-2 counter asks the
      # generator what it built.
      - name: Generated rooms, and the layer register
        id: sgenerated_rooms_and_the_layer_register
        continue-on-error: true
        run: |
          cd station
          python3 rooms.py
          python3 directory.py

      # HOW MUCH OF EACH LOCATION IS ACTUALLY BUILT, measured off the emitted
      # mesh rather than off a plan or a bay count. `deck.py --sweep` answers
      # "how much of the station can I walk in" per LOCATION and says 128 of
      # 128 -- a count of locations REACHED, not of location BUILT. Measured in
      # 4e the difference was the whole product: `bay_span_m`'s docstring ends
      # "the full location is then that bay instanced along its footprint" and
      # nothing instanced it, so `docking_bays` was 140 m in the gazetteer and
      # 10.8 m on the deck.
      #
      # Its negative control is one flag: `--legacy` rebuilds one bay per
      # location, which is what every session before this one shipped, and this
      # gate fails on it -- 115 of 128 places short and the station at 6.8% of
      # its own declared length. A gate that cannot fail on the content it was
      # written for is measuring the wrong thing.
      - name: Every location's geometry spans its own footprint
        id: sfootprint
        continue-on-error: true
        run: |
          cd station
          python3 rooms.py --footprint

      - name: Streaming cell manifest
        id: sstreaming_cell_manifest
        continue-on-error: true
        run: |
          cd station
          python3 -c "import interior as I; s,p=I.load(); m=I.write_cell_manifest('generated/cell_manifest.json',s,p); print(m['decks'],'decks',m['cells'],'cells')"
          git diff --exit-code generated/cell_manifest.json

      # Layer 3. The material library and -- the part that was missing -- the
      # gate that the scene files on disk agree with it. Material rules used to
      # be emitted to a .txt for a human to paste into a .tscn; the first
      # material added after that exported cleanly, passed every assertion, and
      # never reached the render, and two others had been missing from the
      # exterior scene for longer. Nothing was gating on it because this file
      # never ran materials.py at all.
      - name: Materials, and that the scenes still agree with them
        id: smaterials_and_that_the_scenes_still_agre
        continue-on-error: true
        run: python3 station/materials.py

      # Layer 3's completion counter and its plausibility rules. Separate from
      # materials.py because it asks a different question: not "is the library
      # self-consistent" but "does every surface the station actually emits
      # have a material, and is that material physically and canonically
      # defensible".
      #
      # THE `|| true` IS GONE. It was correct when it was written -- this gate
      # failed on purpose while layer 3 was incomplete, and the coverage line
      # was the layer's progress number. Layer 3 finished at 118/118 and the
      # escape hatch outlived it, which left the completion gate for a finished
      # layer running in CI with its exit code discarded: a gate that cannot
      # fail, the one defect this project most wants to avoid, sitting in the
      # file that is supposed to catch them. It exits 0 on its own now.
      - name: Layer 3 coverage and material plausibility
        id: slayer_3_coverage_and_material_plausibili
        continue-on-error: true
        run: python3 station/test_materials_layer3.py

      # NEVER RAN IN CI AT ALL. 41 checks over the exterior component library --
      # cobra bays, observation domes and rotundas, docking ports, mooring
      # clamps -- including the closure checks that caught `dome_mesh` shipping
      # 56 boundary edges per dome, invisible because the hole faces into the
      # hull.
      # The metric that makes blockout unable to pass layer 2. --selftest only:
      # the bare `density.py` report exits 1 BY DESIGN until the content is
      # rebuilt, and a gate that is red on purpose must not block the branch.
      - name: Geometric detail metric
        id: sgeometric_detail_metric
        continue-on-error: true
        run: python3 station/density.py --selftest

      # THE GATE EVERY OTHER GATE HERE WAS MISSING: can a player stand up and
      # walk? Everything else measures a part in isolation, so for three phases
      # nothing failed for the station having no floor. Launches Godot headless
      # and drives a real body over real physics frames.
      - name: The station is walkable
        id: sthe_station_is_walkable
        continue-on-error: true
        run: python3 station/walkable.py --rooms 6

      # AND A PERSON IS SOMETHING YOU BUMP INTO. `rooms.is_solid` keeps every
      # `npc_` group OUT of the static collision on purpose -- static collision
      # is generated once, so an inhabitant baked into it is a permanent
      # statue -- so nothing in the static mesh can answer this. `--bump`
      # steers the body straight at a named resident and reports how close it
      # gets, against a control run with their capsule off that walks through
      # them. Both runs, every time: a solid claim needs the control.
      - name: The inhabitants are solid
        id: sthe_inhabitants_are_solid
        continue-on-error: true
        run: python3 station/walkable.py --deck blue/0/0 --deck-only --bump

      # W5 -- THE LOOP: spawn -> walk -> use something -> AN NPC REACTS. The
      # three walkable steps around this one test rooms, solidity and a
      # streamed cell; NONE of them asserts that anybody looks up, and the full
      # deck run that does has never been a CI step. So the one assertion in
      # this project that a player is NOTICED could regress silently, and did.
      #
      # RED TODAY, and established as PRE-EXISTING by direct A/B rather than
      # assumed: `noticed=0, turned_deg=0.0` at `docking_bays`, reproduced on
      # two consecutive runs, and reproduced IDENTICALLY with
      # `station/{interior,rooms,directory}.py` checked out at the commit before
      # session 4r's z-awareness work. CLAUDE.md's W5 row still quotes the
      # passing form -- "7 of the room look up (123 deg turned, 4 deg off)" --
      # so this regressed at some point between 3z and now with nothing running
      # that could see it.
      #
      # It goes in RED on purpose. A gate that does not run is not a gate, and
      # that sentence is in CLAUDE.md because 34 steps once sat behind a failing
      # one for thirty pushes.
      - name: The loop -- somebody notices you walk in
        id: swalkloop
        continue-on-error: true
        run: python3 station/walkable.py --deck blue/0/0

      # CAN EVERYONE YOU CAN WALK UP TO SPEAK? The shipped build printed
      # "21 people can speak, of 84 in the cast" and the obvious reading was
      # that the cast grew and the writing did not. WRONG: `sidecar()` emits a
      # row for every actor with a `who.id` and all 84 carry one -- the baked
      # file was written a day before the actors file it describes. Re-baked it
      # is 84 of 84. The defect was a stale artefact, not a content gap, and
      # nothing could see it because no gate compared the two.
      #
      # Two checks, because neither can see the other's failure: coverage alone
      # passes on a stale pair that happen to agree, freshness alone passes on
      # a current file covering half the deck. Both controls shown firing.
      # The bar is 100% and it is reachable rather than aspirational -- every
      # deck on disk meets it today.
      - name: Everybody you can walk up to can speak
        id: sdialoguecoverage
        continue-on-error: true
        run: python3 station/dialogue.py --coverage

      # ...AND THE SHIPPED SCENE ACTUALLY USES IT. The gate below proves a
      # streamed cell is a place; it proves nothing about whether a PLAYER ever
      # reaches one, and until session 4k none did: `boot.py` named one .glb and
      # `main.gd` never set `cells_path`, so `godot --path godot` took walk.gd's
      # other branch and loaded one deck whole. docs/MASTER-PLAN.md P0.5 calls
      # that its single most load-bearing finding, because every player-facing
      # system built before it is fixed is validated on a topology the shipped
      # world does not have.
      #
      # HERMETIC ON PURPOSE. station/generated/scene/ is gitignored, so a check
      # that needed a built deck could never run here. The assertions are made
      # against a fixture deck and cell set in a temp dir -- no engine, no build,
      # ~40 ms -- and each has a control that must fail. It failed on the commit
      # before this one, on both halves.
      - name: The shipped scene streams
        id: sthe_shipped_scene_streams
        continue-on-error: true
        run: python3 station/boot.py --gate

      # A STREAMED CELL IS A PLACE, NOT A SHELL. Every other walkability gate
      # here loads one .glb whole and wires it once, so none of them can fail
      # for a station whose doors are solid because the geometry arrived late --
      # which is exactly what docs/streaming-4g.md shipped. Two subject runs
      # (the visit, and the same route with the corridor crowd in it) and six
      # controls, every one of which must fail.
      - name: A streamed cell has working doors, people and interactables
        id: sstreamed_cell_is_a_place
        continue-on-error: true
        run: python3 station/walkable.py --stream

      # AND THE WHOLE STATION, not six rooms of it. `--sweep` is the only gate
      # here that asks a whole-station question: every deck assembles, every
      # room has a door, and no doorway has a hole in the floor.
      - name: How much of the station can be walked in
        id: show_much_of_the_station_can_be_walked_in
        continue-on-error: true
        run: python3 station/deck.py --sweep

      # The drum is a different KIND of walkable surface -- a heightfield, not a
      # corridor -- so its collision is the SHAPE of its own ground rather than
      # a smooth shell, and its gate measures SLOPE rather than lip. See
      # station/drum_walk.py; `--full` adds the whole-drum survey at ~70 s.
      - name: The habitat drum is walkable
        id: sthe_habitat_drum_is_walkable
        continue-on-error: true
        run: python3 station/drum_walk.py --selftest

      - name: Exterior components
        id: sexterior_components
        continue-on-error: true
        run: python3 station/components.py

      # Also never ran. The LOD chain is what the exterior shot actually
      # renders: export_scene reads hull_lod0.obj, not hull.obj, and nothing
      # else in the pipeline regenerates it.
      #
      # AND THE COMMENT ABOVE DIAGNOSED IT WHILE THE COMMAND BELOW DID NOT FIX
      # IT. `lod.py` bare runs the SELFTEST; `--build` is what writes
      # `hull_lod0..7.obj`. So "nothing else regenerates it" was true of this
      # step too, and `export_scene`'s own check -- "every chain level has a
      # built mesh" -- has been failing on eight missing files that no step in
      # this pipeline creates. `--build` runs the selftest as well (lod.py:1149
      # only skips it when --build or --report is given, and 1157/1161 run the
      # build's own assertions), so this is strictly more checking, not less.
      - name: LOD chain
        id: slod_chain
        continue-on-error: true
        run: python3 station/lod.py --build

      # Layer 4 infrastructure. The interior scene has more materials than the
      # other two combined and had no .tscn at all until now, so none of them
      # had ever been rendered. This does not render -- there is no GPU here --
      # it exports the scene, which is what catches a generator whose group
      # shape changed or a room that stopped building.
      - name: Interior shot exports
        id: sinterior_shot_exports
        continue-on-error: true
        run: |
          python3 tools/export_scene.py --shot interior --room corridor --out /tmp/i.png >/dev/null
          python3 tools/export_scene.py --shot interior --room junction --out /tmp/j.png >/dev/null
          # One room per archetype family that behaves differently in the light
          # rig: a spot-lit high bay, an omni-lit batten room, a festooned
          # market, a single-key chapel and a deck-channel corridor room. A
          # sixth would add coverage of no new code path.
          for r in medlab_one fabrication black_market interfaith_chapel hydroponics; do
            python3 tools/export_scene.py --shot interior --room "$r" --out /tmp/$r.png >/dev/null
          done
          echo "interior shot exports for corridor, junction and five rooms"

      # The nine bespoke modules the interior shot can assemble. This is the
      # step that would have caught the state this session started in: fifty
      # locations had materials and in several cases lamps, and NOT ONE of them
      # could be assembled into a shot -- `interior_geometry` raised SystemExit
      # for every module-built place, so none had ever been rendered from the
      # inside and nothing said so. Each entry point here is a different
      # function with a different signature, established by reading each
      # module's own _selftest; a signature change breaks silently otherwise.
      #
      # `plant_zone` earns its place twice: it is the only module that builds
      # in STATION coordinates, so it is the only one exercising
      # `unroll_to_local` and the declared-walkway standpoint.
      - name: Bespoke interior shot exports
        id: sbespoke_interior_shot_exports
        continue-on-error: true
        run: |
          for r in zocalo cnc customs_north bar_unnamed council_chamber \
                   docking_bays qtr_command alien_sector plant_zone; do
            python3 tools/export_scene.py --shot interior --room "$r" \
              --out "/tmp/$r.png" >/dev/null
          done
          echo "interior shot exports for nine bespoke modules"

      # export_scene's own gates over the light rig: that every archetype has
      # an exposure and an ambient, that every fitting rooms.py places resolves
      # to a material that emits, and that every fitting is either a measured
      # source or a measured emissive rather than falling into the
      # emissive-only default by being forgotten.
      - name: Scene assembly and the interior light rig
        id: sscene_assembly_and_the_interior_light_ri
        continue-on-error: true
        run: python3 tools/export_scene.py

      # The frame statistic the room exposures were calibrated with. It has a
      # self-test because a measurement that cannot fail is the same defect as
      # an assertion that cannot fail -- and this one was WRONG about what it
      # measured on its first day, comparing a whole-frame percentile against
      # a hand-region measurement and landing the corridor two and a half
      # stops hot before the reference frame was run through the same code.
      # Guards the distribution tolerances against drifting from the corpus they
      # were derived from: --derive recomputes all six bands from the 33
      # authority-1 frames and fails if a recorded value has moved. NOT
      # --gate-drum, which exits 1 by design until the exposures are addressed.
      - name: Frame distribution tolerances still match their corpus
        id: sframe_distribution_tolerances_still_matc
        continue-on-error: true
        run: python3 tools/measure_frame.py --derive

      - name: Frame luminance measurement
        id: sframe_luminance_measurement
        continue-on-error: true
        run: python3 tools/measure_frame.py

      - name: Rotating-frame physics
        id: srotating_frame_physics
        continue-on-error: true
        run: python3 station/physics/test_rotating_frame.py

      - name: Precision and floating origin
        id: sprecision_and_floating_origin
        continue-on-error: true
        run: python3 station/physics/test_floating_origin.py

      # THE DOCK, AND THE DATA THE ENGINE READS. Both were missing until 4p.
      # `--build` writes station/generated/scene/starfury/{starfury.glb,
      # launch.json,vectors.json} -- the three files `starfury.gd` reads BY PATH
      # and which no CI step had ever rebuilt, so they survived only because
      # somebody once ran the builder by hand (tools/wiring.py --data reported
      # them "present but no CI step rebuilds them").
      #
      # `--dock-gate` flies the dock at the measured cobra bay from every start
      # phase over one rotation: 12 of 12 dock, peak 72.7% of the airframe's
      # 18.38 m/s^2, tightest hull clearance 28.1 m. Its strongest assertion is
      # the A/B against launch -- the dock's contact velocity IS the launch's
      # release velocity, agreeing to 1.98e-03 m/s on 55.1483 m/s -- because
      # docking is launch run backwards and the two share one bay model.
      # Controls: null the phase match and the craft misses by ~298 m; ask for
      # 300 m of standoff (past the derived 227.8 m ceiling) and it is refused;
      # ask for 227 m (inside it, but leaving 0.1% of thrust for control) and it
      # is refused too. ~15 s.
      - name: The Starfury docks
        id: sstarfury_dock
        continue-on-error: true
        run: |
          python3 station/physics/test_docking.py
          python3 station/starfury_scene.py --build
          python3 station/starfury_scene.py --dock-gate

      - name: Starfury flight model
        id: sstarfury_flight_model
        continue-on-error: true
        run: python3 station/physics/test_starfury.py

      # The mesh and the flight model hold separate copies of the thruster
      # layout so that editing one and not the other fails loudly. That gate is
      # worthless unless it runs, and it only runs here.
      - name: Starfury airframe, and that it still agrees with the flight model
        id: sstarfury_airframe_and_that_it_still_agre
        continue-on-error: true
        run: |
          python3 station/starfury_geometry.py
          python3 station/test_starfury_geometry.py

      - name: Docking
        id: sdocking
        continue-on-error: true
        run: python3 station/physics/test_docking.py

      - name: Core shuttle and radial transit
        id: score_shuttle_and_radial_transit
        continue-on-error: true
        run: python3 station/physics/test_core_shuttle.py

      # SOMEBODY TALKS BACK, AND HOW MANY OF THEM.
      #
      # `--selftest`'s 37 checks all ask whether the DERIVATION is sound -- a
      # table is total, a topic outranks another, an era row fires -- and not
      # one of them could fail for *"there is no way to answer"*, which is what
      # 2,139 lines of it were. `--converse` asks the player's question with
      # denominators: how many of the baked cast can be spoken to, how many
      # distinct things they say, how many offer a line BACK, whether pressing
      # is worth anything and can be refused, and whether the same person says
      # the same thing at 03:00 and 13:00. It also asserts the derivation
      # REACHES THE BUILD -- the shipped `boot.json` named no dialogue sidecar
      # when this was written, so every other number was true and nobody spoke.
      #
      # Three controls, each removing one mechanism: `SAY` emptied, the
      # register forced to yield, and the clock held still.
      - name: Somebody talks back -- the conversation gate
        id: sconverse
        continue-on-error: true
        run: |
          python3 station/dialogue.py --selftest
          python3 station/dialogue.py --converse

      - name: NPC names
        id: snpc_names
        continue-on-error: true
        run: python3 station/npc/test_names.py

      - name: NPC schedules
        id: snpc_schedules
        continue-on-error: true
        run: python3 station/npc/test_schedule.py

      # Bodies, costume and crowd. `body.py` carries its own closure gates --
      # signed volume, an edge census and a ray-parity `contains()` -- because
      # the first lineup render showed limbs detached from the torso and no
      # existing gate could see it. Those gates only protect anything if they
      # run here.
      - name: NPC bodies, costume and crowd
        id: snpc_bodies_costume_and_crowd
        continue-on-error: true
        run: |
          cd station/npc
          python3 body.py
          python3 costume.py
          python3 crowd.py

      # THE FRICTION, IN A CORRIDOR, WITHOUT THE PLAYER. `docs/MASTER-PLAN.md`'s
      # traceability matrix gates the owner's scope line "every major faction
      # present, with the friction between them visible in a corridor" as "two
      # factions' members pass; a measurable interaction occurs without the
      # player". Before this the friction was a spawn radius and a line of
      # dialogue -- both of them the player's own frame.
      #
      # `faction.py` is the 28 FAC blocks as a queryable register (which
      # factions is this person in). `friction.py` is the distance table and
      # now the multi-facet query that used to live in `dialogue.py`.
      # `encounter.py` runs one deck's own walkers round the ring for a
      # station-hour and reports N encounters / M grievances / K world deltas,
      # with the frictionless twin as its control. ~50 s all told; the deck
      # build is 28 s of it.
      - name: Faction friction in a corridor
        id: sfaction_friction
        continue-on-error: true
        run: |
          cd station/npc
          python3 faction.py --selftest
          python3 friction.py --selftest
          python3 encounter.py --gate

      # Animation and navigation are the two that touch station geometry, so
      # they are the two a schema change can silently break. Slowest gates in
      # the project at ~24 s and ~77 s; both are worth it.
      - name: NPC animation and navigation
        id: snpc_animation_and_navigation
        continue-on-error: true
        run: |
          cd station/npc
          python3 animation.py
          python3 navigation.py

      # --- the 4i amendment's rule 2: a gate is not adopted until it is a
      # step here. These three existed for a session before they ran in CI,
      # which is exactly the defect walkable.py had for thirty pushes.
      - name: No two named places are the same place (both build paths)
        id: sdegeneracy
        continue-on-error: true
        run: |
          python3 station/deck.py --degeneracy

      - name: Variety -- is this place different from that place?
        id: svariety
        continue-on-error: true
        run: |
          python3 station/variety.py --matrix --rebuild

      # WHERE IN A ROOM CAN A BODY STAND, AND HOW DOES IT GET THERE. The L3
      # commute stopped 5.59 m from its post for a session and was written up
      # twice as a lift defect; measured, the last leg of the route was a
      # straight line from the doorway to the register's centre through a desk
      # rank, laid before rooms had furniture in them. Cheap, no engine, and
      # its two negative controls both fire: an empty room collapses to one
      # waypoint at the centre, and a `doorpanel_*` group is not a wall.
      - name: Where in a room a body can stand, and the way in
        id: sroomnav
        continue-on-error: true
        run: python3 station/roomnav.py --selftest

      - name: A resident's day is derivable and controlled (agenda selftests)
        id: sagenda_selftest
        continue-on-error: true
        run: |
          python3 station/agenda.py --selftest
          python3 station/agenda.py --selftest3

      # P1-G1: ONE COMPLETE JOB LOOP -- work, pay, spend, and the world
      # notices. MASTER-PLAN §A2's third source of hours is "the role: the
      # player IS someone", gated at complete loops rather than at existence,
      # so this asserts DENOMINATORS: N shifts worked off the real manifest,
      # credits before and after, a purchase that leaves a stock and a till
      # delta, and the delta still there when a second process looks again.
      #
      # `--controls` is the half that matters: five removals, each of one
      # mechanism this landed, each asserted to turn the claim that names it
      # red. Wages off -> five shifts and the purse never moves, which is
      # exactly what the project did before this existed.
      - name: The job loop -- a dock shift, its pay, and a bar that debits
        id: sjob_loop
        continue-on-error: true
        run: |
          python3 station/economy.py --selftest
          python3 station/dockwork.py --selftest
          python3 station/dockwork.py --controls

      # THE NAVIGATION GRAPH, IN THE ENGINE -- P0.6's last item. Until this
      # existed, `grep -rn Navigation godot/` returned nothing: every route
      # this project had ever walked was chosen in Python and played back, so
      # an inhabitant could FOLLOW a route and could not CHOOSE one.
      #
      # Three questions, and a denominator rather than an existence proof:
      # all 741 pairs of walkable z-clusters routed in GDScript at run time and
      # compared NODE FOR NODE against `route_walk.path_between`; every node
      # resolved with nothing in the scene tree, with a residency filter as the
      # control; and one named resident's body walking a route the engine found
      # after the scene was up. Runs the graph half always; the walk half needs
      # the collision shells under `station/generated/scene/navwalk/`.
      - name: The navigation graph is in the engine, and a body walks it
        id: snavgraph
        continue-on-error: true
        run: python3 station/navgraph_export.py --gate

      # THE-STATION.md's anti-rig clause, executable: the registry must be
      # producible from the live annexes (every item checked, every pointer
      # resolving, no duplicates), and the checker reports the honest ledger.
      # RED rows do not fail CI -- RED is the truth -- but an ambiguity that
      # prevents the registry existing does.
      - name: Completion spec -- registry generates and the ledger reports
        id: sspec_gate
        continue-on-error: true
        run: |
          python3 tools/spec_registry.py --check
          python3 tools/spec_registry.py
          python3 station/spec_check.py --smoke

      # The plan hierarchy itself. A plan document nobody points at is read
      # AFTER the superseded rulings by every future context -- the same defect
      # as a gate that does not run, at plan scale.
      - name: The plan chain -- every plan doc is placed, every pointer resolves
        id: sdoc_chain
        continue-on-error: true
        run: python3 tools/doc_chain.py

      # Built-but-unreachable, which has now happened six times. Every gate in
      # this file scores a PART against a standard, and a part with no caller
      # still meets its standard -- so none of them can fail for it. This asks
      # whether the shipped path reaches the thing that was built: does every
      # `station/generated/...` path an engine script reads exist, is its
      # producer run by CI, and does anything import each tested module.
      #
      # IT IS RED TODAY AND THAT IS CORRECT: `--mode=transit` reads
      # `scene/transit/lift.json` and nothing has built it. Seconds to run; no
      # build, no render, no GPU.
      - name: Is the built thing actually reachable
        id: swiring
        continue-on-error: true
        run: python3 tools/wiring.py --selftest

      # IS EVERY LOCATED PLACE INSIDE THE SHIP? No other gate here can ask it.
      # Every gate above measures a place against a standard of its own kind --
      # density, materials, exposure, whether a body can walk to it -- and a
      # room ninety metres outside the pressure hull passes all of them,
      # because each is a question about the room and none is a question about
      # where the room is. The interior renders could not show it either: you
      # cannot see the hull from inside a room with no window.
      #
      # IT IS RED TODAY AND THAT IS THE POINT. 35 of 129 places are built
      # outside the hull, 22 at their own centre z (`cnc` by 100.7 m,
      # `mainstage_node` by 135.9 m) and 13 only at one end of their own
      # footprint. A further 15 are inside it and name a deck number their
      # stack cannot index.
      #
      # ~13 s, measured rather than guessed -- and measured under load, with two
      # agents and another gate on a four-core box, so it is an upper bound. No
      # build, no render, no GPU. The cost is 401 hull samples per place (see
      # `interior.narrowest_z`) plus two deck-stack resolutions each; it was
      # written up as "seconds" before it was timed, which is the kind of
      # unchecked number this file exists to stop.
      - name: Is every place inside the pressure hull
        id: shullfit
        continue-on-error: true
        run: python3 station/interior.py --hull-fit

      # WHAT IS OUTSIDE A WINDOW. Needs no engine and no GPU; ~90 s cold and
      # seconds once the aperture cache is warm. RED TODAY: 5 of 38, all of
      # them the same register rows `shullfit` reports above, reached by a
      # different route -- the dome C&C sits inside is built 780 m and 90
      # degrees away from where the register puts C&C.
      - name: What is outside a window
        id: svista
        continue-on-error: true
        run: python3 station/vista.py --selftest

      # AND DOES THE SHIPPED BUILD MOUNT IT? `svista` above checks the DATA;
      # this checks the CALLER, in the engine, which is the only thing that can.
      # `vista.gd` was complete and mounted only by `render_shot.gd` -- the
      # render path -- so a player at C&C's window saw the background colour
      # while a render of the same room showed the station. Instance ten of
      # finished machinery with no caller on the shipped path.
      #
      # It PASSES and it prints the thing that is still wrong: the boot cell
      # cluster is 838 m along the axis from the nearest window, so the mount
      # is correct and cannot fire in the build as it boots today. That number
      # is computed from the spawn, so it moves on its own when the build
      # boots somewhere else.
      #
      # Needs the engine; ~40 s headless, no GPU.
      - name: Does the shipped build mount what is outside a window
        id: svistamount
        continue-on-error: true
        run: |
          G=$(ls -1 /home/user/godot-build/*/bin/godot.linuxbsd.*.double.* 2>/dev/null | head -1)
          if [ -z "$G" ]; then echo "no Godot build here -- skipped"; exit 0; fi
          "$G" --headless --path godot -- --vista-gate 2>&1 | grep -E "^VISTA"

      # P1-G2. The tier ladder, and arrest -> brig -> fine -> release closing
      # with every leg routed on the graph a resident commutes on. ~44 s, of
      # which ~36 s is `navigation.build_graph()` -- the escort and court legs
      # ARE paths on it, so it cannot be skipped. `--selftest` is a graph-free
      # 7/7 half and is NOT a substitute: it does not test the chain.
      - name: Progression and consequence -- the tier ladder and the arrest chain
        id: sconsequence
        continue-on-error: true
        run: python3 station/consequence.py --gate

      # WHAT HAPPENS AFTER A REFUSAL. `tools/wiring.py --selftest` lists
      # `scene/enforcement.json` under "on disk but not rebuilt by CI" -- an
      # engine data path with no CI producer, which survives only because
      # somebody once ran the builder by hand. That is the Starfury defect
      # verbatim, and it is the reason this step exists rather than the gate
      # being interesting on its own.
      #
      # `--bake` must run AFTER `--selftest` and is what writes the JSON.
      # ~90 s, of which ~40 s is `navigation.build_graph()`: the escort and
      # court legs ARE paths on it, so it cannot be skipped. The ENGINE half
      # (`enforcement.py --gate`) needs a built deck and a Godot binary,
      # neither of which CI has -- the same reason `coldstart.py`'s G1/G4/G5
      # skip here.
      - name: A refusal is answered -- the arrest chain, baked
        id: senforcement
        continue-on-error: true
        run: |
          python3 station/enforcement.py --selftest
          python3 station/enforcement.py --bake

      # THE INCIDENT GENERATOR -- P1-G3 / SYS-14. THIRTY classes whose rates
      # come from station state that already exists (traffic.hall_rate,
      # traffic.berths_in_use, security.hostility, audio.species_mix,
      # schedule.ROLE_WEIGHTS, arrival.checks sampled through its own code
      # path, costume.ERA_EVENTS, and -- for the lived-in half added in 4o --
      # rooms.bays_in's dwelling count, schedule.RHYTHMS' species clocks,
      # consequence.py's rung ladder, economy.LADDER's rents and
      # economy.opening_stock's depth) rather than being authored, drawn per
      # one-minute step over every register place. It reads
      # len(directory.PLACES) and the spec's own class count rather than any
      # literal, so it does not need editing when either grows -- which is the
      # same defect as a hardcoded 128 and was removed for the same reason.
      #
      # The class table is checked against `docs/spec/PLACES.md` §0.2 AND
      # `docs/spec/SYSTEMS.md` SYS-14 by PARSING BOTH FILES, both directions --
      # a class here with no spec row, or a spec row with no class, fails; and
      # the COUNT is the spec's count, not a literal in the module.
      #
      # ~140 s: a 60-minute headless window over the whole station, five
      # headless station-days (day 1, day 2 carried, day 2 fresh, the 4x-step
      # control, the S2E01 control), the three-stance replay of all 30 classes,
      # and eleven negative controls -- including the SUBTRACTION that is the
      # lived-in half's own before/after, the sealed Markab quarter (10 built
      # units, no residents, 0.0000/h of domestic incident, so a rate that used
      # unit count rather than households present would fire in an empty tomb),
      # and the count of classes that book somebody into the brig with the
      # player ABSENT -- 4 of the original 22, 0 of the 8 added. It does NOT
      # build geometry -- it reads rooms.bays_in for the tiling count and
      # nothing else -- so it does not contend with the deck gates.
      - name: The incident generator
        id: sincident
        continue-on-error: true
        run: |
          python3 station/incident.py --selftest
          python3 station/incident.py --gate

      # SYS-15, THE CIVIC CALENDAR. The one mechanism the incident generator
      # deliberately refused: festivals, faith rotas, weddings, funerals,
      # drills and invitation-gated receptions are CALENDAR-shaped rather than
      # rate-shaped, and an observance that happens at a random hour is not an
      # observance. 210 observances a station-week over 20 of 129 places.
      #
      # Its controls are the point: EMPTY (the rule table cleared -- this
      # project's state before the file) fails 8 of 8 content assertions;
      # FROZEN (every rule forced day-independent and maximal) fails exactly
      # the one that matters, "two consecutive days DIFFER"; and moving the
      # datum to S2E01 removes R-MINIPAX and R-OFFICE entirely.
      #
      # NAMED civic_calendar.py, not calendar.py: `station/` goes on sys.path,
      # so a module named `calendar` there SHADOWS THE STDLIB for everything
      # that imports it.
      - name: The civic calendar
        id: scivic_calendar
        continue-on-error: true
        run: python3 station/civic_calendar.py --gate

      # THE PLANT, AND WHETHER IT CAN FAIL. The owner's requirement was that the
      # station "can be messed up and have real effects"; power, air, water,
      # waste, food and rotation were geometry plus a staffing roster, and C&C
      # had a watch roster controlling nothing that could break.
      #
      # Six systems over 21 register rows, capacity N+1 against each system's
      # own design peak, so margin@peak IS 1/(N-1) -- a fact about
      # directory.PLACES rather than a number anybody chose. THE REGISTER
      # PRODUCED THE FINDING: water reclamation and rotation are SINGLE ROWS,
      # so the two systems the station cannot do without are the two with no
      # redundant twin -- and what stands behind water instead is a sourced
      # 30-day reserve. Air is two orders faster than anything else (5.8 h) and
      # CO2 is why, not oxygen.
      #
      # It feeds incident.py rather than inventing parallel classes: two units
      # out takes INC-BROWNOUT at reactor_hall from 1.877e-05 to 4.110e-02 an
      # hour, sheds 61 places with 78,271 people standing in them, and takes a
      # station-hour from 64 incidents to 168.
      #
      # ITS BEST CONTROL REPRODUCES A CACHE DEFECT ON PURPOSE: with
      # incident._LAM left alone, a degraded hour returns BYTE-IDENTICAL results
      # to a nominal one, because _fixed_lams memoised on a key the plant state
      # was not in -- which reads exactly like a model that never reached the
      # simulation. That is what the third patch hunk is for. ~34 s.
      - name: The plant can fail
        id: splant_systems
        continue-on-error: true
        run: python3 station/plant_systems.py --gate

      - name: Confirm the schema still parses and is fully sourced
        id: sconfirm_the_schema_still_parses_and_is_f
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open("station/schema/station.yaml"))
          # Every auth-5 value is an extrapolation and must be logged as an
          # invention, or canon and guesswork have started to blur.
          inv = open("canon/INVENTIONS.md").read()
          missing = []
          def walk(node, path=""):
              if isinstance(node, dict):
                  if node.get("auth") == 5 and "src" in node:
                      pass
                  for k, v in node.items():
                      walk(v, f"{path}.{k}")
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, f"{path}[{i}]")
          walk(d)
          for tag in ("INV-001", "INV-002", "INV-003"):
              if tag not in inv:
                  missing.append(tag)
          if missing:
              print("missing invention entries:", missing); sys.exit(1)
          print("schema parses; invention log intact")
          PY

      # ---------------------------------------------------------------
      # EVERY GATE RUNS, AND THE BUILD STILL FAILS IF ANY OF THEM DID.
      #
      # Before session 4e this workflow was 41 sequential steps with no
      # `continue-on-error` anywhere, and step 4 -- `Performance budgets`
      # -- fails BY DESIGN, because `budget.py` is honestly over. So the
      # 34 steps after it never executed. Among them: `The station is
      # walkable`, `How much of the station can be walked in`, `The
      # habitat drum is walkable`, `Canon assertions`, `NPC bodies`.
      #
      # CLAUDE.md says walkable.py "runs in CI". It did not, and had not
      # for THIRTY consecutive pushes -- all 30 most recent runs red, none
      # green. A red build that stops at the first failure tells you one
      # thing; this one was hiding thirty-four.
      #
      # The fix is not to make `budget.py` pass. It is that ONE failing
      # gate must not blind every gate after it. Each step now runs and
      # records its own outcome, and this step fails the job if any of
      # them failed -- so the build is exactly as red as before and the
      # other 34 answers are visible.
